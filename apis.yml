description: 'BabyQuip is the #1 baby equipment rental service and marketplace, offering thousands of baby gear items in over 5,000+ cities across
  the US, Canada, Mexico, Caribbean, Australia & New Zealand. Founded in 2016 by traveling parents, it provides clean, safe, insured rentals of
  cribs, strollers, car seats, toys, and more, improving family travel experiences. Over 500,000 reservations have been completed, with 62% of
  parents saying renting saved their vacation.'

